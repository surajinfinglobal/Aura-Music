name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android Platforms and Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AuraMusic-Latest.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Latest-APK
          path: AuraMusic-Latest.apk
          if-no-files-found: error

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AuraMusic-Latest.apk
          tag_name: latest
          name: "Aura Music - Latest Public Release"
          body: |
            ## 🎵 Aura Music Android App
            
            Sabse latest version download karne ke liye neeche diye gaye link par click karein:
            
            👉 **[Download AuraMusic-Latest.apk](https://github.com/${{ github.repository }}/releases/download/latest/AuraMusic-Latest.apk)**
            
            ### Installation Instructions:
            1. Download par click karein.
            2. File complete hone ke baad apne phone par open karein.
            3. "Install from Unknown Sources" allow karein aur install karein.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
